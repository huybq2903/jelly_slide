<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Jelly Slide: Block Puzzle</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d3f9a; overflow: hidden; }
      /* Ba lớp chồng nhau: nền (2D), cảnh 3D (WebGL, trong suốt), giao diện (2D, trong suốt). Chỉ lớp trên cùng nhận chạm. */
      #bg, #scene, #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bg, #scene { pointer-events: none; }
      #game { touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="scene"></canvas>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
